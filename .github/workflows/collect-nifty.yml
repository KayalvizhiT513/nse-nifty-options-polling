name: Collect Nifty options

on:
  schedule:
    # Two overlapping sessions stay below the six-hour hosted-runner limit.
    # 08:50–14:35 IST, then 14:20–16:15 IST (collection stops at 15:45).
    - cron: '20 3 * * 1-5'
    - cron: '50 8 * * 1-5'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Test duration (1–330 minutes); 0 runs until 16:15 IST or the 350-minute safety cap'
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: nifty-collection-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.NIFTY_GITHUB_COLLECTOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NIFTY_PUSH_TOKEN: ${{ secrets.NIFTY_ARCHIVE_TOKEN }}
      SESSION_MINUTES: ${{ inputs.minutes || '0' }}
      SESSION_END: ${{ github.event.schedule == '20 3 * * 1-5' && '14:35' || '16:15' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: collector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiohttp==3.13.5'
      - name: Collect and checkpoint to private data repository
        run: python -u -m collector.run_headless --minutes "$SESSION_MINUTES" --end-at "$SESSION_END"
